        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK v8.2
        run: gradle assembleDebug

      - name: Opublikuj gotowy plik APK v8.2 w Wydaniach (Releases)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk iwazePRO-v8.2.apk
          gh release delete v8.2 --cleanup-tag --yes || true
          gh release create v8.2 iwazePRO-v8.2.apk --title "iwazePRO v8.2 (Turbo + Dymek Messenger - Naprawiony Start)" --notes "Wersja 8.2: Naprawiono synchronizację włącznika ON/OFF, czas gestu ustawiono na pewne 20 ms (>1 klatka 60Hz), notificationTimeout=10 ms, rozrzut punktów kliknięcia oraz pływający dymek Messenger."
