          package pl.itaxiwaze.bridge;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Bundle;
          import android.widget.Toast;
          import java.net.URLDecoder;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class RedirectActivity extends Activity {

              private static final Pattern COORD_PATTERN = Pattern.compile("(-?\\d+\\.\\d+)\\s*,\\s*(-?\\d+\\.\\d+)");

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Uri incomingUri = getIntent() != null ? getIntent().getData() : null;
                  if (incomingUri != null) {
                      handleNavigationUri(incomingUri);
                  }
                  finish();
              }

              private void handleNavigationUri(Uri uri) {
                  String fullUri = uri.toString();
                  String targetCoords = null;
                  String targetQuery = null;

                  String destCandidate = extractParamFromRaw(fullUri, "destination=");
                  if (destCandidate == null) destCandidate = extractParamFromRaw(fullUri, "daddr=");
                  if (destCandidate == null) destCandidate = extractParamFromRaw(fullUri, "q=");

                  if (destCandidate == null && uri.isHierarchical()) {
                      destCandidate = uri.getQueryParameter("destination");
                      if (destCandidate == null) destCandidate = uri.getQueryParameter("daddr");
                      if (destCandidate == null) destCandidate = uri.getQueryParameter("q");
                  }

                  if (destCandidate != null && !destCandidate.trim().isEmpty()) {
                      String cleanDest = decodeUrl(destCandidate);
                      Matcher m = COORD_PATTERN.matcher(cleanDest);
                      if (m.find()) {
                          targetCoords = m.group(1) + "," + m.group(2);
                      } else {
                          targetQuery = cleanDest;
                      }
                  } else {
                      String decodedFull = decodeUrl(fullUri);
                      Matcher m = COORD_PATTERN.matcher(decodedFull);
                      while (m.find()) {
                          String lat = m.group(1);
                          String lon = m.group(2);
                          if (!"0.0".equals(lat) && !"0".equals(lat)) {
                              targetCoords = lat + "," + lon;
                          }
                      }
                  }

                  String resolved = targetCoords != null ? targetCoords : targetQuery;
                  SharedPreferences prefs = getSharedPreferences("bridge_logs", MODE_PRIVATE);
                  prefs.edit()
                      .putString("last_uri", fullUri)
                      .putString("last_dest", resolved != null ? resolved : "Brak")
                      .apply();

                  launchWaze(targetCoords, targetQuery, fullUri);
              }

              private String extractParamFromRaw(String raw, String key) {
                  int idx = raw.indexOf(key);
                  if (idx != -1) {
                      String val = raw.substring(idx + key.length());
                      int amp = val.indexOf("&");
                      if (amp != -1) val = val.substring(0, amp);
                      return decodeUrl(val);
                  }
                  return null;
              }

              private void launchWaze(String coords, String query, String rawUri) {
                  SharedPreferences prefs = getSharedPreferences("bridge_logs", MODE_PRIVATE);
                  int mode = prefs.getInt("waze_mode", 0);

                  String wazeUrl;
                  String label;

                  if (coords != null && !coords.isEmpty()) {
                      label = coords;
                      if (mode == 1) {
                          wazeUrl = "https://waze.com/ul?ll=" + coords + "&navigate=yes";
                      } else if (mode == 2) {
                          wazeUrl = "google.navigation:q=" + coords;
                      } else {
                          wazeUrl = "waze://?ll=" + coords + "&navigate=yes";
                      }
                  } else if (query != null && !query.isEmpty()) {
                      label = query;
                      if (mode == 1) {
                          wazeUrl = "https://waze.com/ul?q=" + Uri.encode(query) + "&navigate=yes";
                      } else if (mode == 2) {
                          wazeUrl = "google.navigation:q=" + Uri.encode(query);
                      } else {
                          wazeUrl = "waze://?q=" + Uri.encode(query) + "&navigate=yes";
                      }
                  } else {
                      return;
                  }

                  Toast.makeText(this, "Cel Waze: " + label, Toast.LENGTH_SHORT).show();

                  Intent wazeIntent = new Intent(Intent.ACTION_VIEW, Uri.parse(wazeUrl));
                  wazeIntent.setPackage("com.waze");
                  wazeIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);

                  try {
                      startActivity(wazeIntent);
                  } catch (ActivityNotFoundException e) {
                      String fallbackUrl = (coords != null && !coords.isEmpty())
                              ? "https://waze.com/ul?ll=" + coords + "&navigate=yes"
                              : "https://waze.com/ul?q=" + Uri.encode(query) + "&navigate=yes";
                      Intent webIntent = new Intent(Intent.ACTION_VIEW, Uri.parse(fallbackUrl));
                      webIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(webIntent);
                  }
              }

              private String decodeUrl(String val) {
                  try {
                      return URLDecoder.decode(val, "UTF-8").trim();
                  } catch (Exception e) {
                      return val.trim();
                  }
              }
          }
