                  @Override
                  public boolean onTouchEvent(MotionEvent event) {
                      if (chatHeadParams == null || windowManager == null) return false;
                      DisplayMetrics dm = getResources().getDisplayMetrics();

                      switch (event.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              downRawX = event.getRawX();
                              downRawY = event.getRawY();
                              startWinX = chatHeadParams.x;
                              startWinY = chatHeadParams.y;
                              isDragging = false;
                              return true;

                          case MotionEvent.ACTION_MOVE:
                              float dx = event.getRawX() - downRawX;
                              float dy = event.getRawY() - downRawY;
                              if (Math.hypot(dx, dy) > dp(8)) {
                                  isDragging = true;
                              }
                              if (isDragging) {
                                  chatHeadParams.x = Math.max(0, Math.min(dm.widthPixels - getWidth(), (int) (startWinX + dx)));
                                  chatHeadParams.y = Math.max(dp(24), Math.min(dm.heightPixels - getHeight() - dp(24), (int) (startWinY + dy)));
                                  try {
                                      windowManager.updateViewLayout(this, chatHeadParams);
                                  } catch (Exception ignored) {}
                              }
                              return true;

                          case MotionEvent.ACTION_UP:
                          case MotionEvent.ACTION_CANCEL:
                              if (!isDragging) {
                                  toggleAutoFromBubble();
                              } else {
                                  int center = chatHeadParams.x + getWidth() / 2;
                                  chatHeadParams.x = (center < dm.widthPixels / 2)
                                          ? dp(4)
                                          : (dm.widthPixels - getWidth() - dp(4));
                                  try {
                                      windowManager.updateViewLayout(this, chatHeadParams);
                                  } catch (Exception ignored) {}
                              }
                              return true;
                      }
                      return false;
                  }
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event == null) return;
                  CharSequence pkgCs = event.getPackageName();
                  if (pkgCs != null) {
                      String pkg = pkgCs.toString();
                      if (pkg.equals(OWN_PACKAGE) || !pkg.equals(ITAXI_PACKAGE)) {
                          return;
                      }
                  }
                  scanActiveWindow();
              }

              private void scheduleFollowUp(long delayMs) {
                  handler.removeCallbacks(followUpScanner);
                  handler.postDelayed(followUpScanner, delayMs);
              }

              private AccessibilityNodeInfo getItaxiRootNode() {
                  AccessibilityNodeInfo active = getRootInActiveWindow();
                  if (active != null) {
                      CharSequence pkg = active.getPackageName();
                      if (pkg != null && ITAXI_PACKAGE.equals(pkg.toString())) {
                          return active;
                      }
                      active.recycle();
                  }
                  try {
                      List<AccessibilityWindowInfo> windows = getWindows();
                      if (windows != null) {
                          for (AccessibilityWindowInfo win : windows) {
                              AccessibilityNodeInfo r = win.getRoot();
                              if (r != null) {
                                  CharSequence pkg = r.getPackageName();
                                  if (pkg != null && ITAXI_PACKAGE.equals(pkg.toString())) {
                                      return r;
                                  }
                                  r.recycle();
                              }
                          }
                      }
                  } catch (Exception ignored) {}
                  return null;
              }

              private void scanActiveWindow() {
                  AccessibilityNodeInfo root = getItaxiRootNode();
                  if (root == null) return;

                  List<AccessibilityNodeInfo> allNodes = new ArrayList<>(120);
                  StringBuilder dumpBuilder = new StringBuilder(512);
                  collectNodesFast(root, allNodes, dumpBuilder, 0);
                  String screenText = dumpBuilder.toString().trim();

                  if (screenText.isEmpty()) {
                      root.recycle();
                      return;
                  }

                  SharedPreferences prefs = getSharedPreferences("bridge_logs", MODE_PRIVATE);
                  long now = System.currentTimeMillis();

                  if (now - lastDebugSaveTime > 400) {
                      lastDebugSaveTime = now;
                      String shortDump = screenText.length() > 360 ? screenText.substring(0, 360) + "..." : screenText;
                      prefs.edit()
                          .putString("last_pkg", ITAXI_PACKAGE)
                          .putString("last_seen_text", shortDump)
                          .apply();
                  }

                  boolean autoEnabled = prefs.getBoolean("auto_enabled", false);
                  if (!autoEnabled) {
                      root.recycle();
                      return;
                  }

                  DisplayMetrics dm = getResources().getDisplayMetrics();
                  int screenW = dm.widthPixels;
                  int screenH = dm.heightPixels;

                  String normScreen = normalizePl(screenText);

                  // 0. OKNO PRZYPOMNIENIA O TERMINÓWCE ("PAMIĘTAM")
                  AccessibilityNodeInfo pamietamBtn = findButtonByNormalizedText(allNodes, "pamietam");
                  if (pamietamBtn != null) {
                      if (now - lastPamietamClickTime > 2500) {
                          lastPamietamClickTime = now;
                          if (!clickViaActionOnly(pamietamBtn)) {
                              clickNodeUsingGestureFirst(pamietamBtn);
                          }
                          prefs.edit().putString("last_decision", "Potwierdzono przypomnienie: PAMIĘTAM").apply();
                      }
                      root.recycle();
                      return;
                  }

                  // BLOKADA EKRANÓW KOLEJKOWYCH, KOPERT I AKTYWNEGO KURSU
                  if (normScreen.contains("kolejki strefy") || normScreen.contains("koperty") ||
                      normScreen.contains("kopertach") || normScreen.contains("rezygnuj ze strefy") ||
                      normScreen.contains("zaloguj na kopert") || normScreen.contains("rozpocznij kurs") ||
                      normScreen.contains("jestes w kolejce") || normScreen.contains("czekasz:") ||
                      normScreen.contains("dostepne strefy") || normScreen.contains("jestes w kursie")) {
                      root.recycle();
                      return;
                  }

                  // ETAP 3: EKRAN POTWIERDZENIA ("Potwierdzenie" / "przyjąć terminówkę")
                  if (screenText.contains("Potwierdzenie") || normScreen.contains("przyjac terminowke") || normScreen.contains("chcesz przyjac")) {
                      if (now - lastStage3ClickTime < 85) {
                          scheduleFollowUp(40);
                          root.recycle();
                          return;
                      }
                      lastStage3ClickTime = now;
                      lastAcceptedTimestamp = now;

                      AccessibilityNodeInfo confirmBtn = findConfirmButton(allNodes);
                      if (confirmBtn != null) {
                          clickNodeUsingGestureFirst(confirmBtn);
                      } else {
                          clickCoordinatesWithSpread((int) (screenW * 0.75f), (int) (screenH * 0.81f), dp(20), dp(10));
                      }
                      scheduleFollowUp(60);
                      prefs.edit().putString("last_decision", "ETAP 3: Klikam POTWIERDŹ!").apply();
                      root.recycle();
                      return;
                  }

                  // ETAP 2: EKRAN SZCZEGÓŁÓW ZLECENIA ("ZAPISZ SIĘ" / "ROZPOCZNIJ" / "PRZYJMIJ")
                  AccessibilityNodeInfo zapiszBtn = findButtonByText(allNodes, "ZAPISZ SI");
                  AccessibilityNodeInfo rozpocznijBtn = findPureRozpocznijButton(allNodes);
                  AccessibilityNodeInfo przyjmijBtn = findPurePrzyjmijButton(allNodes);

                  AccessibilityNodeInfo actionBtn = zapiszBtn != null ? zapiszBtn :
                                                   (rozpocznijBtn != null ? rozpocznijBtn : przyjmijBtn);

                  if (actionBtn != null) {
                      if (now - lastBackActionTime < 350) {
                          scheduleFollowUp(60);
                          root.recycle();
                          return;
                      }

                      if (now - lastStage2AcceptClickTime < 180) {
                          scheduleFollowUp(45);
                          root.recycle();
                          return;
                      }

                      // OCHRONA PRZED WCZESNYM KLIKNIĘCIEM ROZPOCZNIJ NA PRZYSZŁEJ TERMINÓWCE
                      if (actionBtn == rozpocznijBtn) {
                          if (isFutureScheduledOrderForRozpocznij(screenText, normScreen)) {
                              String addr = findOrderAddressOnScreen(allNodes, screenW, screenH);
                              lastBackActionTime = now;
                              performGlobalAction(GLOBAL_ACTION_BACK);
                              scheduleFollowUp(300);
                              markOrderRejected(buildOrderSignature(screenText, addr), prefs);
                              if (!lastClickedListAddr.isEmpty()) {
                                  markOrderRejected(lastClickedListAddr, prefs);
                              }
                              prefs.edit().putString("last_decision", "BLOKADA: Za wcześnie na Rozpocznij dla terminówki!").apply();
                              root.recycle();
                              return;
                          }
                      }

                      String addressLine = findOrderAddressOnScreen(allNodes, screenW, screenH);
                      if (addressLine == null && !lastClickedListAddr.isEmpty()) {
                          addressLine = lastClickedListAddr;
                      }
                      String signature = buildOrderSignature(screenText, addressLine);
                      Decision decision = evaluateFullCriteria(screenText, normScreen, addressLine, signature, now, prefs);

                      if (decision.accept) {
                          lastStage2AcceptClickTime = now;
                          lastAcceptedTimestamp = now;
                          clickNodeUsingGestureFirst(actionBtn);
                          scheduleFollowUp(45);
                          saveAcceptedTimeSlot(screenText, signature, prefs);
                          prefs.edit().putString("last_decision", "ETAP 2 (BIORĘ): " + decision.reason).apply();
                      } else {
                          if (now - lastAcceptedTimestamp < 3500) {
                              scheduleFollowUp(80);
                              root.recycle();
                              return;
                          }
                          if (now - lastStage1ClickTime < 150 && !decision.hardReject) {
                              scheduleFollowUp(35);
                              root.recycle();
                              return;
                          }
                          lastBackActionTime = now;
                          performGlobalAction(GLOBAL_ACTION_BACK);
                          scheduleFollowUp(280);
                          markOrderRejected(signature, prefs);
                          if (!lastClickedListAddr.isEmpty()) {
                              markOrderRejected(lastClickedListAddr, prefs);
                          }
                          prefs.edit().putString("last_decision", "ETAP 2 (ODRZUCAM): " + decision.reason).apply();
                      }
                      root.recycle();
                      return;
                  }

                  // ETAP 1: LISTA "Dostępne zlecenia"
                  if (screenText.contains("Dostępne zlecenia")) {
                      if (now - lastStage1ClickTime < 140 || now - lastBackActionTime < 250) {
                          scheduleFollowUp(50);
                          root.recycle();
                          return;
                      }

                      boolean scanPoznan = prefs.getBoolean("scan_poznan_list", true);
                      boolean isNightClock = isNightHours();
                      String rejectedOrders = prefs.getString("rejected_orders", "");

                      for (AccessibilityNodeInfo node : allNodes) {
                          String t = getNodeText(node);
                          if (isAddressCandidate(node, t, screenW, screenH)) {
                              String cleanAddr = cleanSpacesFast(t);
                              if (rejectedOrders.contains("[" + cleanAddr + "]")) {
                                  continue;
                              }

                              boolean isPoznan = normalizePl(cleanAddr).contains("poznan");
                              if (!isPoznan || scanPoznan || isNightClock) {
                                  lastStage1ClickTime = now;
                                  lastClickedListAddr = cleanAddr;
                                  clickNodeUsingGestureFirst(node);
                                  scheduleFollowUp(45);
                                  prefs.edit().putString("last_decision", "ETAP 1 (OTWIERAM): " + cleanAddr).apply();
                                  break;
                              }
                          }
                      }
                  }

                  root.recycle();
              }

              private boolean isFutureScheduledOrderForRozpocznij(String screenText, String normScreen) {
                  boolean isNaTeraz = normScreen.contains("na teraz") || normScreen.contains("na juz");
                  int orderSlot = extractTimeSlotWithDate(screenText);
                  if (orderSlot >= 0) {
                      Calendar cal = Calendar.getInstance();
                      int currentMin = cal.get(Calendar.HOUR_OF_DAY) * 60 + cal.get(Calendar.MINUTE);
                      int currentSlot = (cal.get(Calendar.YEAR) * 400 + cal.get(Calendar.DAY_OF_YEAR)) * 1440 + currentMin;
                      int diff = orderSlot - currentSlot;
                      if (diff < -720 && diff > -1440) {
                          diff += 1440;
                      }
                      if (diff > 15) {
                          return true;
                      }
                  }
                  if (!isNaTeraz && (normScreen.contains("terminowk") || normScreen.contains("jutro"))) {
                      return true;
                  }
                  return false;
              }

              private static class Decision {
                  boolean accept;
                  boolean hardReject;
                  String reason;
                  Decision(boolean accept, String reason) {
                      this(accept, false, reason);
                  }
                  Decision(boolean accept, boolean hardReject, String reason) {
                      this.accept = accept;
                      this.hardReject = hardReject;
                      this.reason = reason;
                  }
              }

              private Decision evaluateFullCriteria(String screenText, String normScreen, String addressLine, String signature, long now, SharedPreferences prefs) {
                  boolean timeFilterEnabled = prefs.getBoolean("time_filter_enabled", false);
                  int rawMinuteOfDay = extractMinuteOfDay(screenText);

                  if (timeFilterEnabled) {
                      if (rawMinuteOfDay < 0) {
                          Calendar cal = Calendar.getInstance();
                          int currentMin = cal.get(Calendar.HOUR_OF_DAY) * 60 + cal.get(Calendar.MINUTE);
                          if (!isMinuteInActiveSlots(currentMin, prefs)) {
                              return new Decision(false, true, "Zlecenie Na Teraz poza wybranymi blokami");
                          }
                      } else {
                          if (!isMinuteInActiveSlots(rawMinuteOfDay, prefs)) {
                              int h = rawMinuteOfDay / 60;
                              int m = rawMinuteOfDay % 60;
                              return new Decision(false, true, String.format("Godzina kursu %02d:%02d poza blokami", h, m));
                          }
                      }
                  }

                  int orderTimeSlot = extractTimeSlotWithDate(screenText);
                  if (orderTimeSlot >= 0 && hasTimeCollision(orderTimeSlot, signature, now, prefs)) {
                      return new Decision(false, true, "Kolizja czasowa z innym kursem (bufor 50 min)");
                  }

                  boolean isNightOrder = (rawMinuteOfDay >= 0)
                          ? isNightMinuteOfDay(rawMinuteOfDay)
                          : isNightHours();

                  if (isNightOrder) {
                      return new Decision(true, "Noc (22:00-06:00) - biorę bez warunków: " + (addressLine != null ? addressLine : "Kurs"));
                  }

                  String matchedLocality = findAgglomerationLocality(normScreen);
                  if (matchedLocality != null) {
                      return new Decision(true, "Aglomeracja/Trasa (" + matchedLocality + ")");
                  }

                  int price = extractPricePln(screenText);
                  if (price > 0 && price < 80) {
                      return new Decision(false, true, "Za niska kwota (" + price + " zł)");
                  }

                  String matchedKeyword = matchPriorityKeyword(normScreen);
                  if (matchedKeyword != null) {
                      return new Decision(true, "Wykryto w opisie: " + matchedKeyword);
                  }

                  if (price >= 100) {
                      return new Decision(true, "Kwota >= 100 zł (" + price + " zł)");
                  }

                  boolean isBilet = normScreen.contains("cena gwaran");
                  if (price >= 80 && !isBilet) {
                      return new Decision(true, "Biznes >= 80 zł (" + price + " zł)");
                  }

                  return new Decision(false, false, "Poznań w dzień bez jawnej kwoty >=80/100 zł / słów kluczowych / aglomeracji");
              }

              private String findAgglomerationLocality(String normScreen) {
                  if (normScreen == null || normScreen.isEmpty()) return null;
                  for (int i = 0; i < NORM_TARGET_LOCALITIES.size(); i++) {
                      String normLoc = NORM_TARGET_LOCALITIES.get(i);
                      if (normLoc.equals("sobota") || normLoc.equals("sroda")) {
                          if (hasWholePhrase(normScreen, ", " + normLoc)) {
                              return TARGET_LOCALITIES.get(i);
                          }
                          continue;
                      }
                      if (hasWholePhrase(normScreen, normLoc)) {
                          return TARGET_LOCALITIES.get(i);
                      }
                  }
                  return null;
              }

              private boolean hasWholePhrase(String text, String phrase) {
                  int idx = text.indexOf(phrase);
                  while (idx != -1) {
                      boolean leftOk = (idx == 0) || !Character.isLetterOrDigit(text.charAt(idx - 1));
                      int endIdx = idx + phrase.length();
                      boolean rightOk = (endIdx >= text.length()) || !Character.isLetterOrDigit(text.charAt(endIdx));
                      if (leftOk && rightOk) {
                          return true;
                      }
                      idx = text.indexOf(phrase, idx + 1);
                  }
                  return false;
              }

              private boolean isMinuteInActiveSlots(int minuteOfDay, SharedPreferences prefs) {
                  int slotIndex = minuteOfDay / 180;
                  if (slotIndex < 0) slotIndex = 0;
                  if (slotIndex > 7) slotIndex = 7;
                  return prefs.getBoolean("slot_" + slotIndex, true);
              }

              private boolean isNightHours() {
                  int hour = Calendar.getInstance().get(Calendar.HOUR_OF_DAY);
                  return (hour >= 22 || hour < 6);
              }

              private boolean isNightMinuteOfDay(int minuteOfDay) {
                  return (minuteOfDay >= 22 * 60 || minuteOfDay < 6 * 60);
              }

              private String matchPriorityKeyword(String normText) {
                  if (normText.contains("przesyl") || normText.contains("paczk") || normText.contains("kurier") ||
                      hasFuzzyWord(normText, "przesylka") || hasFuzzyWord(normText, "przesylki")) {
                      return "Przesyłka / Paczka";
                  }

                  if (normText.contains("kabl") || normText.contains("rozruch") ||
                      normText.contains("akumulator") || normText.contains("odpaleni") ||
                      hasFuzzyWord(normText, "rozruchowe") || hasFuzzyWord(normText, "akumulator")) {
                      return "Kable rozruchowe / Rozruch";
                  }

                  if (normText.contains("kartk") || normText.contains("tablicz") ||
                      normText.contains("z kart") || normText.contains("na kart") ||
                      hasFuzzyWord(normText, "tabliczka") || hasFuzzyWord(normText, "tabliczki")) {
                      return "Odbiór z kartką / tabliczką";
                  }

                  if (normText.contains("lotnisk") || normText.contains("przylot") || normText.contains("odbior z") || normText.contains("odbiory z") ||
                      hasFuzzyWord(normText, "lotnisko") || hasFuzzyWord(normText, "lotniska")) {
                      return "Lotnisko / Odbiór";
                  }

                  if (normText.contains("lawic") || hasFuzzyWord(normText, "lawica") || hasFuzzyWord(normText, "lawicy")) {
                      if (normText.contains("audi") || normText.contains("auto centrum") || normText.contains("autocentrum") ||
                          normText.contains("salon") || normText.contains("serwis") || normText.contains("sklad") ||
                          normText.contains("magazyn") || normText.contains("blach") || normText.contains("lakier") ||
                          normText.contains("porsche") || normText.contains("skoda") || normText.contains("komis") ||
                          normText.contains("tor poznan") || normText.contains("toru poznan")) {
                          return null;
                      }
                      return "Lotnisko Ławica";
                  }

                  return null;
              }

              private static String cleanSpacesFast(String input) {
                  if (input == null || input.isEmpty()) return "";
                  int len = input.length();
                  StringBuilder sb = new StringBuilder(len);
                  boolean lastWasSpace = true;
                  for (int i = 0; i < len; i++) {
                      char c = input.charAt(i);
                      if (c <= ' ') {
                          if (!lastWasSpace) {
                              sb.append(' ');
                              lastWasSpace = true;
                          }
                      } else {
                          sb.append(c);
                          lastWasSpace = false;
                      }
                  }
                  if (sb.length() > 0 && sb.charAt(sb.length() - 1) == ' ') {
                      sb.setLength(sb.length() - 1);
                  }
                  return sb.toString();
              }

              private static String normalizePlStatic(String input) {
                  if (input == null || input.isEmpty()) return "";
                  int len = input.length();
                  StringBuilder sb = new StringBuilder(len);
                  boolean lastWasSpace = true;
                  for (int i = 0; i < len; i++) {
                      char c = Character.toLowerCase(input.charAt(i));
                      if (c <= ' ') {
                          if (!lastWasSpace) {
                              sb.append(' ');
                              lastWasSpace = true;
                          }
                          continue;
                      }
                      lastWasSpace = false;
                      switch (c) {
                          case 'ą': sb.append('a'); break;
                          case 'ć': sb.append('c'); break;
                          case 'ę': sb.append('e'); break;
                          case 'ł': sb.append('l'); break;
                          case 'ń': sb.append('n'); break;
                          case 'ó': sb.append('o'); break;
                          case 'ś': sb.append('s'); break;
                          case 'ź':
                          case 'ż': sb.append('z'); break;
                          default: sb.append(c); break;
                      }
                  }
                  if (sb.length() > 0 && sb.charAt(sb.length() - 1) == ' ') {
                      sb.setLength(sb.length() - 1);
                  }
                  return sb.toString();
              }

              private String normalizePl(String input) {
                  return normalizePlStatic(input);
              }

              private boolean hasFuzzyWord(String normText, String target) {
                  int len = normText.length();
                  int start = -1;
                  for (int i = 0; i <= len; i++) {
                      char c = (i < len) ? normText.charAt(i) : ' ';
                      boolean isAlnum = (c >= 'a' && c <= 'z') || (c >= '0' && c <= '9');
                      if (isAlnum) {
                          if (start == -1) start = i;
                      } else {
                          if (start != -1) {
                              int tokLen = i - start;
                              if (tokLen >= 6 && Math.abs(tokLen - target.length()) <= 1) {
                                  String token = normText.substring(start, i);
                                  if (isEditDistanceAtMostOne(token, target)) {
                                      return true;
                                  }
                              }
                              start = -1;
                          }
                      }
                  }
                  return false;
              }

              private boolean isEditDistanceAtMostOne(String a, String b) {
                  int lenA = a.length();
                  int lenB = b.length();
                  if (Math.abs(lenA - lenB) > 1) return false;

                  if (lenA == lenB) {
                      int diffs = 0;
                      for (int i = 0; i < lenA; i++) {
                          if (a.charAt(i) != b.charAt(i)) {
                              if (i + 1 < lenA && a.charAt(i) == b.charAt(i + 1) && a.charAt(i + 1) == b.charAt(i)) {
                                  i++;
                              }
                              diffs++;
                              if (diffs > 1) return false;
                          }
                      }
                      return true;
                  }

                  String shorter = lenA < lenB ? a : b;
                  String longer = lenA < lenB ? b : a;
                  int i = 0, j = 0, diffs = 0;
                  while (i < shorter.length() && j < longer.length()) {
                      if (shorter.charAt(i) != longer.charAt(j)) {
                          diffs++;
                          if (diffs > 1) return false;
                          j++;
                      } else {
                          i++;
                          j++;
                      }
                  }
                  return true;
              }

              private int extractMinuteOfDay(String text) {
                  Matcher m = TIME_PATTERN.matcher(text);
                  if (m.find()) {
                      try {
                          int h = Integer.parseInt(m.group(1));
                          int min = Integer.parseInt(m.group(2));
                          return h * 60 + min;
                      } catch (Exception ignored) {}
                  }
                  return -1;
              }

              private int extractPricePln(String text) {
                  int maxFound = 0;
                  Matcher m = PRICE_PATTERN.matcher(text);
                  while (m.find()) {
                      try {
                          int val = Integer.parseInt(m.group(1));
                          if (val > maxFound) maxFound = val;
                      } catch (Exception ignored) {}
                  }
                  if (maxFound == 0) {
                      Matcher m2 = RYCZ_FALLBACK_PATTERN.matcher(text);
                      while (m2.find()) {
                          try {
                              int val = Integer.parseInt(m2.group(1));
                              if (val > maxFound) maxFound = val;
                          } catch (Exception ignored) {}
                      }
                  }
                  return maxFound;
              }

              private int extractTimeSlotWithDate(String text) {
                  int minOfDay = extractMinuteOfDay(text);
                  if (minOfDay < 0) return -1;

                  Calendar cal = Calendar.getInstance();

                  Matcher dm = DATE_PATTERN.matcher(text);
                  if (dm.find()) {
                      try {
                          int d = Integer.parseInt(dm.group(1));
                          int m = Integer.parseInt(dm.group(2)) - 1;
                          cal.set(Calendar.DAY_OF_MONTH, d);
                          cal.set(Calendar.MONTH, m);
                      } catch (Exception ignored) {}
                  } else {
                      String combined = normalizePl(text + " " + lastClickedListAddr);
                      if (combined.contains("jutro")) {
                          cal.add(Calendar.DAY_OF_MONTH, 1);
                      }
                  }

                  int year = cal.get(Calendar.YEAR);
                  int dayOfYear = cal.get(Calendar.DAY_OF_YEAR);
                  return (year * 400 + dayOfYear) * 1440 + minOfDay;
              }

              private boolean hasTimeCollision(int orderSlot, String signature, long now, SharedPreferences prefs) {
                  if (orderSlot == lastAcceptedSlot && (now - lastAcceptedTimestamp < 10000)) {
                      return false;
                  }
                  String lastAcceptedSig = prefs.getString("last_accepted_sig", "");
                  if (signature != null && !signature.isEmpty() && signature.equals(lastAcceptedSig)) {
                      return false;
                  }

                  String saved = prefs.getString("accepted_times", "");
                  if (saved.isEmpty()) return false;
                  for (String part : saved.split(",")) {
                      try {
                          int existing = Integer.parseInt(part.trim());
                          if (Math.abs(existing - orderSlot) < 50) {
                              return true;
                          }
                      } catch (Exception ignored) {}
                  }
                  return false;
              }

              private void saveAcceptedTimeSlot(String text, String signature, SharedPreferences prefs) {
                  int slot = extractTimeSlotWithDate(text);
                  lastAcceptedSlot = slot;
                  SharedPreferences.Editor ed = prefs.edit();
                  if (signature != null) {
                      ed.putString("last_accepted_sig", signature);
                  }
                  if (slot >= 0) {
                      String saved = prefs.getString("accepted_times", "");
                      if (!saved.contains(slot + ",")) {
                          ed.putString("accepted_times", saved + slot + ",");
                      }
                  }
                  ed.apply();
              }

              private String findOrderAddressOnScreen(List<AccessibilityNodeInfo> nodes, int screenW, int screenH) {
                  for (AccessibilityNodeInfo n : nodes) {
                      String t = getNodeText(n);
                      if (isAddressCandidate(n, t, screenW, screenH)) {
                          return cleanSpacesFast(t);
                      }
                  }
                  return null;
              }

              private boolean isAddressCandidate(AccessibilityNodeInfo node, String t, int screenW, int screenH) {
                  if (t == null || !node.isVisibleToUser()) return false;
                  String clean = cleanSpacesFast(t);
                  if (clean.length() < 4 || clean.length() > 75) return false;
                  if (clean.startsWith(",") || clean.endsWith(",")) return false;

                  String lower = normalizePl(clean);
                  if (lower.contains("powiadomienie") || lower.contains("dostepne") ||
                      lower.contains("potwierd") || lower.contains("chcesz") ||
                      lower.contains("przyjac") || lower.contains("terminowk") ||
                      lower.contains("gwarant") || lower.contains("rekompensata") ||
                      lower.contains("rycz") || lower.contains("godz") ||
                      lower.contains("koperty") || lower.contains("stref") ||
                      lower.contains("reda") || lower.contains("wroc") ||
                      lower.contains("zapisz") || lower.contains("rozpocznij") ||
                      lower.contains("ukryty") || lower.contains("samochod") ||
                      lower.contains("w promieniu") || lower.contains("podjedz") ||
                      lower.contains("pamietam") || lower.contains("przypomnienie") ||
                      lower.contains("taksometr") || lower.contains("przejazd") ||
                      lower.contains("wszystkie") || lower.contains("nieprzeczytane")) {
                      return false;
                  }

                  boolean hasCommaCity = clean.length() >= 7 && VALID_ADDR_COMMA.matcher(clean).find();
                  boolean hasDirectLocality = clean.length() <= 40 && findAgglomerationLocality(lower) != null;

                  if (!hasCommaCity && !hasDirectLocality) {
                      return false;
                  }

                  Rect rect = new Rect();
                  node.getBoundsInScreen(rect);
                  if (rect.height() <= 0 || rect.width() <= 0) return false;
                  if (rect.centerX() < screenW * 0.05f || rect.centerX() > screenW * 0.95f) return false;
                  if (rect.centerY() < screenH * 0.15f || rect.centerY() > screenH * 0.88f) {
                      return false;
                  }

                  return true;
              }

              private String buildOrderSignature(String screenText, String addressLine) {
                  if (addressLine != null && !addressLine.isEmpty()) {
                      return addressLine;
                  }
                  return Integer.toString(screenText.hashCode());
              }

              private void markOrderRejected(String sig, SharedPreferences prefs) {
                  if (sig == null || sig.isEmpty()) return;
                  String current = prefs.getString("rejected_orders", "");
                  if (current.length() > 3000) current = "";
                  if (!current.contains("[" + sig + "]")) {
                      prefs.edit().putString("rejected_orders", current + "[" + sig + "]").apply();
                  }
              }

              private AccessibilityNodeInfo findButtonByText(List<AccessibilityNodeInfo> nodes, String sub) {
                  String upperSub = sub.toUpperCase();
                  for (AccessibilityNodeInfo n : nodes) {
                      String t = cleanSpacesFast(getNodeText(n)).toUpperCase();
                      if (t.contains(upperSub)) {
                          return n;
                      }
                  }
                  return null;
              }

              private AccessibilityNodeInfo findButtonByNormalizedText(List<AccessibilityNodeInfo> nodes, String normSub) {
                  for (AccessibilityNodeInfo n : nodes) {
                      String t = normalizePl(getNodeText(n));
                      if (t.equals(normSub) || (t.contains(normSub) && t.length() <= 20)) {
                          return n;
                      }
                  }
                  return null;
              }

              private AccessibilityNodeInfo findPureRozpocznijButton(List<AccessibilityNodeInfo> nodes) {
                  for (AccessibilityNodeInfo n : nodes) {
                      String t = cleanSpacesFast(getNodeText(n)).toUpperCase();
                      if (t.equals("ROZPOCZNIJ") || (t.contains("ROZPOCZNIJ") && !t.contains("KURS"))) {
                          return n;
                      }
                  }
                  return null;
              }

              private AccessibilityNodeInfo findPurePrzyjmijButton(List<AccessibilityNodeInfo> nodes) {
                  for (AccessibilityNodeInfo n : nodes) {
                      String t = cleanSpacesFast(getNodeText(n)).toUpperCase();
                      if (t.equals("PRZYJMIJ") || t.equals("PRZYJMIJ ZLECENIE")) {
                          return n;
                      }
                  }
                  return null;
              }

              private AccessibilityNodeInfo findConfirmButton(List<AccessibilityNodeInfo> nodes) {
                  for (AccessibilityNodeInfo n : nodes) {
                      String t = normalizePl(getNodeText(n));
                      if (t.isEmpty()) continue;
                      if (t.contains("anuluj") || t.contains("rezygnuj") || t.contains("odrzuc") || t.contains("cofnij") || t.equals("nie")) {
                          continue;
                      }
                      if (t.equals("potwierdz") || t.equals("potwierdzam") || t.equals("tak") ||
                          t.equals("przyjmij") || t.equals("ok") || t.equals("zapisz sie") ||
                          (t.startsWith("potwierd") && !t.contains("potwierdzenie") && !t.contains("chcesz"))) {
                          return n;
                      }
                  }
                  return null;
              }

              private boolean clickViaActionOnly(AccessibilityNodeInfo node) {
                  AccessibilityNodeInfo current = node;
                  for (int i = 0; i < 4 && current != null; i++) {
                      if (current.isClickable() && current.performAction(AccessibilityNodeInfo.ACTION_CLICK)) {
                          return true;
                      }
                      current = current.getParent();
                  }
                  return false;
              }

              private void clickNodeUsingGestureFirst(AccessibilityNodeInfo node) {
                  Rect rect = new Rect();
                  node.getBoundsInScreen(rect);
                  if (rect.width() > 0 && rect.height() > 0) {
                      int spreadX = Math.max(6, (int) (rect.width() * 0.30f));
                      int spreadY = Math.max(4, (int) (rect.height() * 0.24f));
                      clickCoordinatesWithSpread(rect.centerX(), rect.centerY(), spreadX, spreadY);
                  } else {
                      clickViaActionOnly(node);
                  }
              }

              private void clickCoordinatesWithSpread(int centerX, int centerY, int spreadX, int spreadY) {
                  int targetX = centerX + random.nextInt(spreadX * 2 + 1) - spreadX;
                  int targetY = centerY + random.nextInt(spreadY * 2 + 1) - spreadY;

                  if (Math.abs(targetX - lastTapX) < 12 && Math.abs(targetY - lastTapY) < 12) {
                      targetX = centerX + (targetX >= centerX ? -Math.max(12, spreadX / 2) : Math.max(12, spreadX / 2));
                      targetY = centerY + (targetY >= centerY ? -Math.max(8, spreadY / 2) : Math.max(8, spreadY / 2));
                  }

                  targetX = Math.max(5, targetX);
                  targetY = Math.max(5, targetY);
                  lastTapX = targetX;
                  lastTapY = targetY;

                  Path path = new Path();
                  path.moveTo(targetX, targetY);
                  GestureDescription.Builder builder = new GestureDescription.Builder();
                  builder.addStroke(new GestureDescription.StrokeDescription(path, 0, 20));
                  dispatchGesture(builder.build(), null, null);
              }

              private void collectNodesFast(AccessibilityNodeInfo node, List<AccessibilityNodeInfo> list, StringBuilder sb, int depth) {
                  if (node == null || depth > 14 || list.size() > 210) return;
                  list.add(node);
                  String t = getNodeText(node);
                  if (!t.isEmpty() && !t.equals("Znacznik mapy")) {
                      sb.append(cleanSpacesFast(t)).append(" | ");
                  }
                  int count = node.getChildCount();
                  for (int i = 0; i < count; i++) {
                      AccessibilityNodeInfo child = node.getChild(i);
                      if (child != null) {
                          collectNodesFast(child, list, sb, depth + 1);
                      }
                  }
              }

              private String getNodeText(AccessibilityNodeInfo node) {
                  if (node.getText() != null && node.getText().length() > 0) {
                      return node.getText().toString().trim();
                  }
                  if (node.getContentDescription() != null && node.getContentDescription().length() > 0) {
                      return node.getContentDescription().toString().trim();
                  }
                  return "";
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (windowManager != null && chatHeadView != null && chatHeadView.getParent() != null) {
                      try {
                          windowManager.removeView(chatHeadView);
                      } catch (Exception ignored) {}
                  }
                  if (instance == this) {
                      instance = null;
                  }
              }

              @Override
              public void onInterrupt() {
                  handler.removeCallbacks(followUpScanner);
              }
          }
