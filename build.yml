name: Build iwazePRO APK v8.2

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Wygeneruj projekt Android iwazePRO v8.2
        run: |
          mkdir -p app/src/main/java/pl/itaxiwaze/bridge
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "iwazePRO"
          include(":app")
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application' version '8.7.2'
          }

          android {
              namespace 'pl.itaxiwaze.bridge'
              compileSdk 35

              defaultConfig {
                  applicationId "pl.itaxiwaze.bridge"
                  minSdk 26
                  targetSdk 35
                  versionCode 43
                  versionName "8.2"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#1EA1F2"
                  android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#E5A922"
                  android:pathData="M54,23 C45,27 36,27 31,34 C35,44 33,64 54,82 C75,64 73,44 77,34 C72,27 63,27 54,23 Z"/>
              <path
                  android:fillColor="#F9CA48"
                  android:pathData="M54,26 C46,29 39,29 35,35 C38,44 36,62 54,78 C72,62 70,44 73,35 C69,29 62,29 54,26 Z"/>
              <path
                  android:fillColor="#232F38"
                  android:pathData="M54,22 L73,77 L54,66 Z"/>
              <path
                  android:fillColor="#344450"
                  android:pathData="M54,22 L54,66 L35,77 Z"/>
              <path
                  android:fillColor="#F9CA48"
                  android:pathData="M37,37 H71 V51 H37 Z"/>
              <path
                  android:fillColor="#232F38"
                  android:pathData="M38,39 H46 V41.5 H43.3 V49 H40.7 V41.5 H38 Z"/>
              <path
                  android:fillColor="#232F38"
                  android:pathData="M46.5,49 L50,39 H52.8 L56.3,49 H53.6 L52.9,46.8 H49.9 L49.2,49 Z M50.5,44.6 H52.3 L51.4,41.6 Z"/>
              <path
                  android:fillColor="#232F38"
                  android:pathData="M57,39 H59.8 L61.8,42.3 L63.8,39 H66.6 L63.3,43.9 L66.8,49 H64 L61.8,45.5 L59.6,49 H56.8 L60.3,43.9 Z"/>
              <path
                  android:fillColor="#232F38"
                  android:pathData="M67.8,39 H70.4 V49 H67.8 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">iwazePRO</string>
              <string name="accessibility_desc">Asystent kierowcy iwazePRO</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewScrolled"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="10"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:packageNames="pl.itaxi.driver"
              android:description="@string/accessibility_desc"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds|flagRetrieveInteractiveWindows" />
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <queries>
                  <package android:name="com.waze" />
                  <package android:name="pl.itaxi.driver" />
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="waze" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="iwazePRO"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".RedirectActivity"
                      android:exported="true"
                      android:theme="@android:style/Theme.NoDisplay"
                      android:excludeFromRecents="true"
                      android:noHistory="true">

                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="google.navigation" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="geo" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="http" />
                          <data android:scheme="https" />
                          <data android:host="maps.google.com" />
                          <data android:host="www.google.com" android:pathPrefix="/maps" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ItaxiAutomationService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/pl/itaxiwaze/bridge/MainActivity.java
          package pl.itaxiwaze.bridge;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.GridLayout;
          import android.widget.LinearLayout;
          import android.widget.RadioButton;
          import android.widget.RadioGroup;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;

          public class MainActivity extends Activity {
              private static final int PICK_AVATAR_REQUEST = 901;

              private Button btnToggleAuto;
              private CheckBox cbBubbleEnabled;
              private CheckBox cbTimeFilter;
              private GridLayout timeGrid;
              private Button[] slotButtons = new Button[8];
              private TextView statusView;
              private TextView debugView;
              private TextView logView;

              private int dp(int val) {
                  return (int) TypedValue.applyDimension(
                          TypedValue.COMPLEX_UNIT_DIP, val, getResources().getDisplayMetrics());
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  ScrollView scroll = new ScrollView(this);
                  scroll.setFitsSystemWindows(true);
                  scroll.setBackgroundColor(Color.parseColor("#F5F7FA"));

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(dp(16), dp(56), dp(16), dp(32));

                  TextView title = new TextView(this);
                  title.setText("iwazePRO (v8.2 Turbo)");
                  title.setTextSize(22f);
                  title.setTextColor(Color.parseColor("#111827"));
                  title.setPadding(0, 0, 0, dp(14));
                  layout.addView(title);

                  SharedPreferences prefs = getSharedPreferences("bridge_logs", MODE_PRIVATE);

                  btnToggleAuto = new Button(this);
                  btnToggleAuto.setTextSize(16f);
                  btnToggleAuto.setTextColor(Color.WHITE);
                  btnToggleAuto.setGravity(Gravity.CENTER);
                  btnToggleAuto.setPadding(dp(12), dp(18), dp(12), dp(18));
                  updateToggleButtonStyle(prefs.getBoolean("auto_enabled", false));

                  btnToggleAuto.setOnClickListener(v -> {
                      boolean current = prefs.getBoolean("auto_enabled", false);
                      boolean nextState = !current;
                      SharedPreferences.Editor ed = prefs.edit().putBoolean("auto_enabled", nextState);
                      if (nextState) {
                          ed.remove("rejected_orders");
                          ed.putString("last_decision", "Automat włączony - gotowy do sprawdzania listy");
                      } else {
                          ed.putString("last_decision", "Automat wyłączony");
                      }
                      ed.apply();
                      ItaxiAutomationService.refreshBubbleFromUi();
                      updateToggleButtonStyle(nextState);
                      onResume();
                  });
                  layout.addView(btnToggleAuto);

                  LinearLayout bubbleBox = new LinearLayout(this);
                  bubbleBox.setOrientation(LinearLayout.VERTICAL);
                  bubbleBox.setBackgroundColor(Color.parseColor("#DBEAFE"));
                  bubbleBox.setPadding(dp(12), dp(10), dp(12), dp(10));
                  LinearLayout.LayoutParams bubbleBoxLp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  bubbleBoxLp.setMargins(0, dp(12), 0, dp(4));
                  bubbleBox.setLayoutParams(bubbleBoxLp);

                  cbBubbleEnabled = new CheckBox(this);
                  cbBubbleEnabled.setText("Pływający dymek ON/OFF (Styl Messenger - zielona kropka = WŁ, szara = WYŁ)");
                  cbBubbleEnabled.setTextSize(13.5f);
                  cbBubbleEnabled.setTextColor(Color.parseColor("#1E3A8A"));
                  cbBubbleEnabled.setChecked(prefs.getBoolean("bubble_enabled", true));
                  cbBubbleEnabled.setOnCheckedChangeListener((b, isChecked) -> {
                      prefs.edit().putBoolean("bubble_enabled", isChecked).apply();
                      ItaxiAutomationService.refreshBubbleFromUi();
                  });
                  bubbleBox.addView(cbBubbleEnabled);

                  LinearLayout avatarBtns = new LinearLayout(this);
                  avatarBtns.setOrientation(LinearLayout.HORIZONTAL);

                  Button btnPickPhoto = new Button(this);
                  btnPickPhoto.setText("Własne zdjęcie z galerii");
                  btnPickPhoto.setTextSize(11.5f);
                  btnPickPhoto.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                  btnPickPhoto.setOnClickListener(v -> {
                      Intent pick = new Intent(Intent.ACTION_GET_CONTENT);
                      pick.setType("image/*");
                      startActivityForResult(Intent.createChooser(pick, "Wybierz zdjęcie do dymka"), PICK_AVATAR_REQUEST);
                  });
                  avatarBtns.addView(btnPickPhoto);

                  Button btnResetPhoto = new Button(this);
                  btnResetPhoto.setText("Domyślna kobieta");
                  btnResetPhoto.setTextSize(11.5f);
                  btnResetPhoto.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                  btnResetPhoto.setOnClickListener(v -> {
                      File f = new File(getFilesDir(), "custom_avatar.png");
                      if (f.exists()) f.delete();
                      ItaxiAutomationService.reloadAvatarFromUi();
                      Toast.makeText(this, "Przywrócono domyślne zdjęcie kobiety", Toast.LENGTH_SHORT).show();
                  });
                  avatarBtns.addView(btnResetPhoto);

                  bubbleBox.addView(avatarBtns);
                  layout.addView(bubbleBox);

                  LinearLayout timeFilterBox = new LinearLayout(this);
                  timeFilterBox.setOrientation(LinearLayout.VERTICAL);
                  timeFilterBox.setBackgroundColor(Color.parseColor("#E0E7FF"));
                  timeFilterBox.setPadding(dp(12), dp(12), dp(12), dp(12));
                  LinearLayout.LayoutParams boxLp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  boxLp.setMargins(0, dp(10), 0, dp(12));
                  timeFilterBox.setLayoutParams(boxLp);

                  cbTimeFilter = new CheckBox(this);
                  cbTimeFilter.setText("Filtruj godziny kursu (Wybierz bloki co 3h)");
                  cbTimeFilter.setTextSize(14f);
                  cbTimeFilter.setTextColor(Color.parseColor("#1E1B4B"));
                  cbTimeFilter.setChecked(prefs.getBoolean("time_filter_enabled", false));
                  cbTimeFilter.setOnCheckedChangeListener((b, isChecked) -> {
                      prefs.edit()
                          .putBoolean("time_filter_enabled", isChecked)
                          .remove("rejected_orders")
                          .apply();
                      updateSlotButtonsState(isChecked);
                  });
                  timeFilterBox.addView(cbTimeFilter);

                  timeGrid = new GridLayout(this);
                  timeGrid.setColumnCount(4);
                  timeGrid.setRowCount(2);
                  timeGrid.setUseDefaultMargins(true);
                  LinearLayout.LayoutParams gridLp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  gridLp.setMargins(0, dp(8), 0, dp(8));
                  timeGrid.setLayoutParams(gridLp);

                  String[] slotLabels = {"00-03", "03-06", "06-09", "09-12", "12-15", "15-18", "18-21", "21-24"};
                  for (int i = 0; i < 8; i++) {
                      final int idx = i;
                      Button btnSlot = new Button(this);
                      btnSlot.setText(slotLabels[i]);
                      btnSlot.setTextSize(12f);
                      btnSlot.setPadding(dp(4), dp(8), dp(4), dp(8));
                      
                      GridLayout.LayoutParams params = new GridLayout.LayoutParams();
                      params.width = 0;
                      params.height = GridLayout.LayoutParams.WRAP_CONTENT;
                      params.columnSpec = GridLayout.spec(i % 4, 1f);
                      params.rowSpec = GridLayout.spec(i / 4, 1f);
                      params.setMargins(dp(2), dp(2), dp(2), dp(2));
                      btnSlot.setLayoutParams(params);

                      boolean slotState = prefs.getBoolean("slot_" + idx, true);
                      updateSingleSlotButton(btnSlot, slotState);

                      btnSlot.setOnClickListener(v -> {
                          boolean curState = prefs.getBoolean("slot_" + idx, true);
                          boolean nextState = !curState;
                          prefs.edit()
                              .putBoolean("slot_" + idx, nextState)
                              .remove("rejected_orders")
                              .apply();
                          updateSingleSlotButton(btnSlot, nextState);
                      });

                      slotButtons[i] = btnSlot;
                      timeGrid.addView(btnSlot);
                  }
                  timeFilterBox.addView(timeGrid);

                  LinearLayout quickBtns = new LinearLayout(this);
                  quickBtns.setOrientation(LinearLayout.HORIZONTAL);

                  Button btnAll = new Button(this);
                  btnAll.setText("Zaznacz wszystkie");
                  btnAll.setTextSize(12f);
                  btnAll.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                  btnAll.setOnClickListener(v -> {
                      SharedPreferences.Editor ed = prefs.edit();
                      for (int i = 0; i < 8; i++) {
                          ed.putBoolean("slot_" + i, true);
                          updateSingleSlotButton(slotButtons[i], true);
                      }
                      ed.remove("rejected_orders").apply();
                  });
                  quickBtns.addView(btnAll);

                  Button btnClearSlots = new Button(this);
                  btnClearSlots.setText("Odznacz wszystkie");
                  btnClearSlots.setTextSize(12f);
                  btnClearSlots.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                  btnClearSlots.setOnClickListener(v -> {
                      SharedPreferences.Editor ed = prefs.edit();
                      for (int i = 0; i < 8; i++) {
                          ed.putBoolean("slot_" + i, false);
                          updateSingleSlotButton(slotButtons[i], false);
                      }
                      ed.apply();
                  });
                  quickBtns.addView(btnClearSlots);

                  timeFilterBox.addView(quickBtns);
                  layout.addView(timeFilterBox);
                  updateSlotButtonsState(cbTimeFilter.isChecked());

                  CheckBox cbScanPoznan = new CheckBox(this);
                  cbScanPoznan.setText("W dzień (06-22) sprawdzaj zlecenia z Poznania (otwiera i sprawdza czy w środku jest >=80/100 zł, aglomeracja, przesyłka, kable, lotnisko, kartka). W nocy (22-06) Poznań brany bez warunków!");
                  cbScanPoznan.setTextColor(Color.parseColor("#1F2937"));
                  cbScanPoznan.setPadding(dp(4), dp(8), dp(4), dp(8));
                  cbScanPoznan.setChecked(prefs.getBoolean("scan_poznan_list", true));
                  cbScanPoznan.setOnCheckedChangeListener((b, isChecked) -> {
                      prefs.edit()
                          .putBoolean("scan_poznan_list", isChecked)
                          .remove("rejected_orders")
                          .apply();
                  });
                  layout.addView(cbScanPoznan);

                  statusView = new TextView(this);
                  statusView.setTextSize(14f);
                  statusView.setTextColor(Color.parseColor("#111827"));
                  statusView.setBackgroundColor(Color.parseColor("#E5E7EB"));
                  statusView.setPadding(dp(12), dp(12), dp(12), dp(12));
                  layout.addView(statusView);

                  debugView = new TextView(this);
                  debugView.setTextSize(12f);
                  debugView.setTextColor(Color.parseColor("#374151"));
                  debugView.setPadding(0, dp(10), 0, dp(14));
                  layout.addView(debugView);

                  Button btnAccessibility = new Button(this);
                  btnAccessibility.setText("0. Ustawienia Ułatwień Dostępu (Włącz usługę)");
                  btnAccessibility.setOnClickListener(v -> {
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                  });
                  layout.addView(btnAccessibility);

                  Button btnClear = new Button(this);
                  btnClear.setText("Wyczyść pamięć odrzuconych zleceń i kolizji");
                  btnClear.setOnClickListener(v -> {
                      prefs.edit()
                          .remove("rejected_orders")
                          .remove("accepted_times")
                          .remove("last_accepted_sig")
                          .putString("last_decision", "Pamięć wyczyszczona - gotowy do skanowania")
                          .apply();
                      onResume();
                      Toast.makeText(this, "Wyczyszczono pamięć zleceń", Toast.LENGTH_SHORT).show();
                  });
                  layout.addView(btnClear);

                  TextView modeLabel = new TextView(this);
                  modeLabel.setText("\nTryb przekazywania trasy do Waze:");
                  modeLabel.setTextSize(15f);
                  modeLabel.setTextColor(Color.parseColor("#111827"));
                  layout.addView(modeLabel);

                  int currentMode = prefs.getInt("waze_mode", 0);
                  RadioGroup group = new RadioGroup(this);
                  RadioButton rb0 = new RadioButton(this);
                  rb0.setId(0);
                  rb0.setText("Tryb 1: waze://?ll=...&navigate=yes (Domyślny)");
                  group.addView(rb0);

                  RadioButton rb1 = new RadioButton(this);
                  rb1.setId(1);
                  rb1.setText("Tryb 2: https://waze.com/ul?ll=...&navigate=yes");
                  group.addView(rb1);

                  RadioButton rb2 = new RadioButton(this);
                  rb2.setId(2);
                  rb2.setText("Tryb 3: google.navigation:q=...");
                  group.addView(rb2);

                  group.check(currentMode);
                  group.setOnCheckedChangeListener((g, checkedId) -> {
                      prefs.edit().putInt("waze_mode", checkedId).apply();
                  });
                  layout.addView(group);

                  Button btnDefaultLinks = new Button(this);
                  btnDefaultLinks.setText("1. Włącz obsługę maps.google.com");
                  btnDefaultLinks.setOnClickListener(v -> {
                      Intent i;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          i = new Intent(Settings.ACTION_APP_OPEN_BY_DEFAULT_SETTINGS,
                                  Uri.parse("package:" + getPackageName()));
                      } else {
                          i = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                                  Uri.parse("package:" + getPackageName()));
                      }
                      startActivity(i);
                  });
                  layout.addView(btnDefaultLinks);

                  Button btnItaxiTest = new Button(this);
                  btnItaxiTest.setText("2. Test nawigacji Waze (Kulasa 118, Poznań)");
                  btnItaxiTest.setOnClickListener(v -> {
                      String url = "https://maps.google.com/maps/dir/?api=1&origin=52.404099%2C16.761282&destination=52.413545%2C16.924420";
                      startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                  });
                  layout.addView(btnItaxiTest);

                  logView = new TextView(this);
                  logView.setTextSize(12f);
                  logView.setTextColor(Color.parseColor("#4B5563"));
                  logView.setPadding(0, dp(12), 0, dp(16));
                  layout.addView(logView);

                  scroll.addView(layout);
                  setContentView(scroll);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == PICK_AVATAR_REQUEST && resultCode == RESULT_OK && data != null && data.getData() != null) {
                      try (InputStream is = getContentResolver().openInputStream(data.getData())) {
                          Bitmap raw = BitmapFactory.decodeStream(is);
                          if (raw != null) {
                              int size = Math.min(raw.getWidth(), raw.getHeight());
                              int x = (raw.getWidth() - size) / 2;
                              int y = (raw.getHeight() - size) / 2;
                              Bitmap square = Bitmap.createBitmap(raw, x, y, size, size);
                              Bitmap scaled = Bitmap.createScaledBitmap(square, 240, 240, true);
                              File out = new File(getFilesDir(), "custom_avatar.png");
                              try (FileOutputStream fos = new FileOutputStream(out)) {
                                  scaled.compress(Bitmap.CompressFormat.PNG, 95, fos);
                              }
                              ItaxiAutomationService.reloadAvatarFromUi();
                              Toast.makeText(this, "Zapisano nowe zdjęcie w dymku!", Toast.LENGTH_SHORT).show();
                          }
                      } catch (Exception e) {
                          Toast.makeText(this, "Nie udało się wczytać zdjęcia", Toast.LENGTH_SHORT).show();
                      }
                  }
              }

              private void updateSingleSlotButton(Button btn, boolean active) {
                  if (active) {
                      btn.setBackgroundColor(Color.parseColor("#15803D"));
                      btn.setTextColor(Color.WHITE);
                  } else {
                      btn.setBackgroundColor(Color.parseColor("#D1D5DB"));
                      btn.setTextColor(Color.parseColor("#4B5563"));
                  }
              }

              private void updateSlotButtonsState(boolean enabled) {
                  for (Button b : slotButtons) {
                      b.setEnabled(enabled);
                      b.setAlpha(enabled ? 1.0f : 0.5f);
                  }
              }

              private void updateToggleButtonStyle(boolean enabled) {
                  if (enabled) {
                      btnToggleAuto.setText("🟢 AUTOMAT ZLECEŃ: WŁĄCZONY\n(Kliknij tutaj lub w dymek, aby WYŁĄCZYĆ)");
                      btnToggleAuto.setBackgroundColor(Color.parseColor("#15803D"));
                  } else {
                      btnToggleAuto.setText("🔴 AUTOMAT ZLECEŃ: WYŁĄCZONY\n(Kliknij tutaj lub w dymek, aby WŁĄCZYĆ)");
                      btnToggleAuto.setBackgroundColor(Color.parseColor("#B91C1C"));
                  }
              }

              @Override
